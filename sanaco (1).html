<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marlon</title>
</head>
<body>
     <h1>BMW M3 COMPETITION</h1> 
     <P>Marlon</p><br> 
    <a href="https://www.bmw.com.br/pt/index.html">BMW</a><br>  
     <img src="bmw.jpeg" alt="200" width="800px" height="500px"><br>
     <button>❤️ <span> 0 </span>​ </button>
</body>

<script>
        const botao = document.querySelector("button");
        botao.addEventListener("click", botaoClicado);

        function botaoClicado(){
            console.log("Fui clicado!");
            let texto = botao.querySelector("span");
            texto.textContent++;
        }
    </script>
</html>
